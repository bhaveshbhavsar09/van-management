<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <i class="ph-fill ph-van"></i>
      <span>Van Fleet</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html"><i class="ph ph-squares-four"></i> Dashboard</a></li>
      <li><a href="vans.html"><i class="ph ph-van"></i> Vans</a></li>
      <li><a href="drivers.html"><i class="ph ph-steering-wheel"></i> Drivers</a></li>
      <li><a href="students.html"><i class="ph ph-student"></i> Students</a></li>
      <li><a href="payments.html"><i class="ph ph-credit-card"></i> Payments</a></li>
      <li><a href="routes.html"><i class="ph ph-map-pin"></i> Routes</a></li>
      <li><a href="maintenance.html"><i class="ph ph-wrench"></i> Maintenance</a></li>
      <li><a href="announcements.html"><i class="ph ph-megaphone"></i> Announcements</a></li>
      <li><a href="calendar.html"><i class="ph ph-calendar"></i> Calendar</a></li>
      <li><a href="tracking.html"><i class="ph ph-map-trifold"></i> Tracking</a></li>
    </ul>
    <div style="padding: 20px; margin-top: auto;">
      <button id="logoutBtn" class="btn-secondary" style="width: 100%; justify-content: center; background-color: #1e293b; color: white; border: none;">
        <i class="ph ph-sign-out"></i> Logout
      </button>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <div style="display: flex; align-items: center; gap: 16px;">
        <button class="mobile-toggle" onclick="toggleSidebar()">
          <i class="ph ph-list"></i>
        </button>
        <div class="header-search">
          <i class="ph ph-magnifying-glass"></i>
          <input type="text" placeholder="Search vans, drivers, students...">
        </div>
      </div>
      <div class="header-user">
        <div class="user-info">
          <span class="user-name">Admin User</span>
          <span class="user-role">Manager</span>
        </div>
        <img src="https://ui-avatars.com/api/?name=Admin+User&background=0ea5e9&color=fff" alt="User">
      </div>
    </header>

    <div class="content-wrapper"><div class="section-header"><div><h1 class="page-title">Parent Portal</h1></div></div><div class="card"><h2 class="card-title">My Children</h2><div id="childrenList">Loading...</div></div><div class="card" style="margin-top: 20px;"><h2 class="card-title">Live Tracking</h2><div id="map" style="height: 400px; width: 100%; border-radius: 12px;"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" /></div>
  </main>
  
  <script src="script.js"></script>
