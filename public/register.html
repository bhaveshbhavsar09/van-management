<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Van Business</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div style="font-size: 3rem; color: var(--primary-color); margin-bottom: 10px;">
      <i class="ph-fill ph-van"></i>
    </div>
    <h2>Create Account</h2>
    <p>Join the van management system</p>
    
    <form id="registerForm">
      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" placeholder="user@example.com" required>
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label for="regRole">Role</label>
        <select id="regRole" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; transition: border-color 0.3s; background: white;">
          <option value="driver">Driver</option>
          <option value="student">Student / Parent</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">Create Account</button>
      <div id="registerError" style="color: var(--danger-color); margin-top: 15px; font-weight: 600;"></div>
      <div id="registerSuccess" style="color: var(--success-color); margin-top: 15px; font-weight: 600;"></div>
      <div style="margin-top: 20px;">
        <a href="login.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Already have an account? Sign in</a>
      </div>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
