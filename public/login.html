<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Van Business</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div style="font-size: 3rem; color: var(--primary-color); margin-bottom: 10px;">
      <i class="ph-fill ph-van"></i>
    </div>
    <h2>Welcome Back</h2>
    <p>Select your role and sign in</p>
    
    <div class="role-selector" style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button type="button" class="btn-secondary" style="flex: 1; border-color: var(--primary-color); background: rgba(14,165,233,0.1);" onclick="selectRole('admin', this)">Admin</button>
      <button type="button" class="btn-secondary" style="flex: 1;" onclick="selectRole('driver', this)">Driver</button>
      <button type="button" class="btn-secondary" style="flex: 1;" onclick="selectRole('student', this)">Student</button>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" value="admin@vanbusiness.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" value="admin123" required>
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
      <div id="loginError" style="color: var(--danger-color); margin-top: 15px; font-weight: 600;"></div>
    </form>
  </div>

  <script>
    function selectRole(role, btn) {
      const buttons = document.querySelectorAll('.role-selector button');
      buttons.forEach(b => {
        b.style.borderColor = 'var(--border-color)';
        b.style.background = 'white';
      });
      btn.style.borderColor = 'var(--primary-color)';
      btn.style.background = 'rgba(14,165,233,0.1)';
      
      document.getElementById('email').value = role + '@vanbusiness.com';
      document.getElementById('password').value = role + '123';
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
