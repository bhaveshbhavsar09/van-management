<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Van Business</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div style="font-size: 3rem; color: var(--primary-color); margin-bottom: 10px;">
      <i class="ph-fill ph-van"></i>
    </div>
    <h2>Welcome Back</h2>
    <p>Sign in to manage your van business</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="admin@vanbusiness.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
      <div id="loginError" style="color: var(--danger-color); margin-top: 15px; font-weight: 600;"></div>
    </form>
  </div>
</body>
</html>
