<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Van Business</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <i class="ph-fill ph-van"></i>
      <span>Van Fleet</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html"><i class="ph ph-squares-four"></i> Dashboard</a></li>
      <li><a href="vans.html"><i class="ph ph-van"></i> Vans</a></li>
      <li><a href="drivers.html"><i class="ph ph-steering-wheel"></i> Drivers</a></li>
      <li><a href="students.html"><i class="ph ph-student"></i> Students</a></li>
      <li><a href="payments.html"><i class="ph ph-credit-card"></i> Payments</a></li>
      <li><a href="routes.html"><i class="ph ph-map-pin"></i> Routes</a></li>
      <li><a href="maintenance.html"><i class="ph ph-wrench"></i> Maintenance</a></li>
      <li><a href="announcements.html"><i class="ph ph-megaphone"></i> Announcements</a></li>
      <li><a href="calendar.html"><i class="ph ph-calendar"></i> Calendar</a></li>
      <li><a href="tracking.html"><i class="ph ph-map-trifold"></i> Tracking</a></li>
    </ul>
    <div style="padding: 20px; margin-top: auto;">
      <button id="logoutBtn" class="btn-secondary" style="width: 100%; justify-content: center; background-color: #1e293b; color: white; border: none;" onclick="logoutUser()">
        <i class="ph ph-sign-out"></i> Logout
      </button>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <div style="display: flex; align-items: center; gap: 16px;">
        <button class="mobile-toggle" onclick="toggleSidebar()">
          <i class="ph ph-list"></i>
        </button>
        <h2 style="margin: 0; font-size: 1.25rem;">My Profile</h2>
      </div>
      
      <div class="header-actions">
        <button class="action-icon" id="darkModeToggle" title="Toggle Dark Mode">
          <i class="ph ph-moon"></i>
        </button>
        
        <div class="dropdown-container">
          <button class="action-icon notification-bell" id="notificationToggle" title="Notifications">
            <i class="ph ph-bell"></i>
            <span class="badge-count" id="notificationCount">0</span>
          </button>
          <div class="dropdown-menu" id="notificationMenu" style="width: 300px; right: -10px;">
            <div style="padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--border-color);">Notifications</div>
            <div id="notificationList" style="max-height: 250px; overflow-y: auto;">
              <div style="padding: 16px; text-align: center; color: var(--text-light); font-size: 0.9rem;">No new notifications</div>
            </div>
            <button class="dropdown-item" style="justify-content: center; color: var(--primary-color);" onclick="markNotificationsRead()">Mark all as read</button>
          </div>
        </div>

        <div class="dropdown-container">
          <div class="header-user" id="profileToggle">
            <div class="user-info">
              <span class="user-name">Admin User</span>
              <span class="user-role role-badge admin">Manager</span>
            </div>
            <img id="headerAvatar" src="https://ui-avatars.com/api/?name=Admin+User&background=0ea5e9&color=fff" alt="User">
          </div>
          <div class="dropdown-menu" id="profileMenu">
            <a href="profile.html" class="dropdown-item">
              <i class="ph ph-user"></i> My Profile
            </a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" style="color: var(--danger-color);" onclick="logoutUser()">
              <i class="ph ph-sign-out"></i> Log Out
            </button>
          </div>
        </div>
      </div>
    </header>

    <div style="padding: 32px;">
      <div class="profile-container">
        
        <!-- Profile Settings Form -->
        <div class="card">
          <h2 class="card-title">Profile Settings</h2>
          <form id="profileForm">
            <div class="form-group">
              <label for="profileName">Full Name</label>
              <input type="text" id="profileName" placeholder="Enter your full name">
            </div>
            <div class="form-group">
              <label for="profileEmail">Email Address (Read Only)</label>
              <input type="email" id="profileEmail" disabled style="background: var(--bg-color); cursor: not-allowed;">
            </div>
            <div class="form-group">
              <label for="profilePhone">Phone Number</label>
              <input type="text" id="profilePhone" placeholder="+1 234 567 8900">
            </div>
            <div class="form-group">
              <label for="profileAvatar">Avatar URL</label>
              <input type="text" id="profileAvatar" placeholder="https://example.com/avatar.png">
            </div>
            
            <h3 style="margin: 20px 0 10px; font-size: 1.1rem; border-top: 1px solid var(--border-color); padding-top: 20px;">Security</h3>
            <div class="form-group">
              <label for="profilePassword">New Password (leave blank to keep current)</label>
              <div style="position: relative;">
                <input type="password" id="profilePassword" style="width: 100%; padding-right: 40px;">
                <i class="ph ph-eye" onclick="togglePasswordVisibility('profilePassword', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.2rem; color: #64748b;"></i>
              </div>
            </div>
            
            <button type="submit" class="btn-primary" style="margin-top: 10px;">Save Changes</button>
            <div id="profileMessage" style="margin-top: 10px; font-weight: 600;"></div>
          </form>
        </div>

        <!-- Activity Log -->
        <div class="card">
          <h2 class="card-title">Activity Log</h2>
          <ul class="activity-timeline" id="activityList">
            <li style="justify-content: center; color: var(--text-light);">Loading activities...</li>
          </ul>
        </div>

      </div>
    </div>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
