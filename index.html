<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Van Business Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🚐 Van Business Management</h1>
  </header>

  <section class="dashboard">
    <div class="card">
      <h2>Total Vans</h2>
      <input type="number" id="vanCount" value="5">
    </div>

    <div class="card">
      <h2>Total Drivers</h2>
      <input type="number" id="driverCount" value="3">
    </div>

    <div class="card">
      <h2>Total Students</h2>
      <input type="number" id="studentCount" value="40">
    </div>

    <div class="card">
      <h2>Pending Driver Payments</h2>
      <input type="number" id="driverPayments" value="2">
    </div>

    <div class="card">
      <h2>Pending Student Fees</h2>
      <input type="number" id="studentFees" value="5">
    </div>

    <div class="card">
      <h2>Van Status</h2>
      <textarea id="vanStatus" rows="3">Van 1 reached school at 8:30 AM</textarea>
    </div>
  </section>

  <section class="van-photo">
    <h2>Your Vans</h2>
    <img src="https://cdn.pixabay.com/photo/2016/11/29/09/08/van-1866521_1280.jpg" alt="Van Photo">
  </section>

  <footer>
    <p>&copy; 2026 Van Business | Designed by Bhavesh</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
